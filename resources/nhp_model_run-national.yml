resources:
  jobs:
    NHP_Model-Run_National:
      name: NHP Model v6.0.0 Run (National)
      tasks:
        - task_key: list_files
          notebook_task:
            notebook_path: ../notebooks/list_files_in_queue.ipynb
          job_cluster_key: run_national_model
        - task_key: run_model
          depends_on:
            - task_key: list_files
          for_each_task:
            inputs: "{{tasks.list_files.values.file_list}}"
            task:
              task_key: run_model_iteration
              notebook_task:
                notebook_path: ../notebooks/nhp_model_run-national.ipynb
                base_parameters:
                  params_path: "{{input}}"
              job_cluster_key: run_national_model
              libraries:
                - whl: ../dist/*.whl
      job_clusters:
        - job_cluster_key: run_national_model
          new_cluster:
            spark_version: 17.3.x-scala2.13
            spark_conf:
              spark.databricks.delta.properties.defaults.autoOptimize.optimizeWrite: "true"
              spark.databricks.delta.properties.defaults.autoOptimize.autoCompact: "true"
              spark.databricks.sql.initial.catalog.namespace: udal_lake_mart
            azure_attributes:
              availability: ON_DEMAND_AZURE
              spot_bid_max_price: 100
            node_type_id: Standard_D4ds_v5
            custom_tags:
              Application: UDAL
              Workload_Type: Job
              Workload_Size: Small
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            policy_id: 000816B2986C0B29
            data_security_mode: USER_ISOLATION
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: false
            autoscale:
              min_workers: 1
              max_workers: 4
      parameters:
        - name: queue_path
          default: "/Volumes/udal_lake_mart/newhospitalprogramme/files/queue/national/"
        - name: data_path
          default: "/Volumes/udal_lake_mart/newhospitalprogramme/files/model_data/v6.0.0/"
        - name: save_full_model_results
          default: "false"
